<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord - szk.kana</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f1012;
      background-image: 
        radial-gradient(at 50% 0%, rgba(88, 101, 242, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(114, 137, 218, 0.1) 0px, transparent 50%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }

    /* ボタンの上のテキスト */
    .user-tag {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #f2f3f5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* Discord風ボタン */
    .discord-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      background-color: #5865F2;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(88, 101, 242, 0.35);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      user-select: none;
    }

    .discord-btn:hover {
      background-color: #4752C4;
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(88, 101, 242, 0.5);
    }

    .discord-btn:active {
      transform: translateY(-1px);
    }

    .discord-btn.disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.5);
    }

    /* 正しいDiscord公式SVGアイコン */
    .discord-icon {
      width: 26px;
      height: 26px;
      fill: currentColor;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- ボタンの上のテキスト -->
    <div class="user-tag">szk.kana</div>

    <!-- リンクボタン -->
    <a id="jump-btn" class="discord-btn disabled" href="#" target="_blank" rel="noopener noreferrer">
      <svg class="discord-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.69,11.45-12.69C48.92,40.31,54,46,53.9,53S48.92,65.69,42.45,65.69ZM84.68,65.69C78.41,65.69,73.26,60,73.26,53s5.15-12.69,11.42-12.69C91.15,40.31,96.27,46,96.13,53S91.15,65.69,84.68,65.69Z"/>
      </svg>
      <span>読み込み中...</span>
    </a>
  </div>

  <script>
    // url.txt から URL を取得してボタンに反映
    fetch('./url.txt')
      .then(response => {
        if (!response.ok) throw new Error('url.txt が見つかりません');
        return response.text();
      })
      .then(text => {
        let targetUrl = text.trim();
        if (targetUrl.includes('url=')) {
          targetUrl = targetUrl.split('url=')[1].trim();
        }

        const btn = document.getElementById('jump-btn');
        btn.href = targetUrl;
        btn.querySelector('span').textContent = 'Discordに参加する';
        btn.classList.remove('disabled');
      })
      .catch(err => {
        console.error(err);
        const btn = document.getElementById('jump-btn');
        btn.querySelector('span').textContent = 'URL読み込みエラー';
      });
  </script>
</body>
</html>

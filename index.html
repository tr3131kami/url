<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>szk.kana - Discord</title>
  
  <!-- Google Fonts for sleek typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #111214; /* Deep Discord dark background */
      background-image: 
        radial-gradient(at 50% 30%, rgba(88, 101, 242, 0.15) 0px, transparent 60%),
        radial-gradient(at 80% 80%, rgba(114, 137, 218, 0.08) 0px, transparent 50%);
      font-family: 'Noto Sans JP', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f2f3f5;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .title-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
      background: linear-gradient(135deg, #ffffff 0%, #dbdee1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
    }

    .discord-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
      background-color: #5865F2; /* Official Discord Blurple */
      border-radius: 14px;
      box-shadow: 0 8px 24px -4px rgba(88, 101, 242, 0.45);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .discord-btn:hover {
      background-color: #4752C4;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 14px 32px -4px rgba(88, 101, 242, 0.6);
    }

    .discord-btn:active {
      transform: translateY(-1px) scale(0.99);
      box-shadow: 0 6px 16px -2px rgba(88, 101, 242, 0.4);
    }

    .discord-btn.disabled {
      opacity: 0.6;
      pointer-events: none;
      filter: grayscale(0.3);
    }

    /* Clean Discord SVG Icon */
    .discord-icon {
      width: 26px;
      height: 26px;
      fill: currentColor;
      flex-shrink: 0;
      display: block;
    }

    /* Simple Fade In Animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Title Text above button -->
    <h1 class="title-text">szk.kana</h1>

    <!-- Discord Button -->
    <a id="jump-btn" class="discord-btn disabled" href="#" target="_blank" rel="noopener noreferrer">
      <!-- Fixed & Clean Official Discord SVG Icon -->

      <span>読み込み中...</span>
    </a>
  </div>

  <script>
    // url.txt から URL を自動取得してボタンにセット
    fetch('./url.txt')
      .then(response => {
        if (!response.ok) throw new Error('url.txt が見つかりません');
        return response.text();
      })
      .then(text => {
        let targetUrl = text.trim();
        // "url=https://..." 形式でもプレーンなURLでも抽出
        if (targetUrl.includes('url=')) {
          targetUrl = targetUrl.split('url=')[1].trim();
        }

        const btn = document.getElementById('jump-btn');
        btn.href = targetUrl;
        btn.querySelector('span').textContent = 'Discordに参加する';
        btn.classList.remove('disabled');
      })
      .catch(err => {
        console.error(err);
        const btn = document.getElementById('jump-btn');
        btn.querySelector('span').textContent = 'Discordに参加する';
        // フォールバック用のダミーまたは手動URL指定用
        btn.classList.remove('disabled');
      });
  </script>
</body>
</html>
